name: Tạo keystore (chạy 1 lần duy nhất)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Tạo release.keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias aimanager \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass aimanager -keypass aimanager -dname "CN=AI Manager"
      - uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore

